syntax = "proto3";

package voicechat;

service VoicechatDaemon {
  
  rpc Start(StartRequest) returns (StartResponse);
  rpc Stop(StopRequest) returns (StopResponse);

  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);

  rpc GetInputVolume(GetInputVolumeRequest) returns (GetInputVolumeResponse);
  rpc SetInputVolume(SetInputVolumeRequest) returns (SetInputVolumeResponse);

  rpc SetOutputVolume(SetOutputVolumeRequest) returns (SetOutputVolumeResponse);
  rpc GetOutputVolume(GetOutputVolumeRequest) returns (GetOutputVolumeResponse);
}

message StartRequest {}
message StartResponse {}

message StopRequest {}
message StopResponse {}

message GetStatusRequest {}
message GetStatusResponse{
  enum Status {
    Stopped = 0;
    Connecting = 1;
    Connected = 2;
    Error = 3;
  }
  Status status = 1;
  string error_message = 2;
}

message ShutdownRequest {}
message ShutdownResponse {}

message GetInputVolumeRequest {}
message GetInputVolumeResponse {
  float volume = 1;
}


message SetInputVolumeRequest {
  float volume = 1;
}
message SetInputVolumeResponse {}


message SetOutputVolumeRequest {
  float volume = 1;
}
message SetOutputVolumeResponse {}


message GetOutputVolumeRequest {
}
message GetOutputVolumeResponse {
  float volume = 1;
}
