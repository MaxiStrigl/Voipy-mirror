[package]
name = "audio_capture"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bytemuck = { version = "1.24.0", features = ["derive"] }
cpal = "0.16.0"
opus = "0.3.0"
ringbuf = "0.4.8"
thiserror = "2.0.17"
protocol = { path = "../protocol/" }
bincode = { version = "2.0.1", features = ["serde"] }
webrtc = "0.14.0"
tokio = { version = "1.48.0", features = ["full"] }
