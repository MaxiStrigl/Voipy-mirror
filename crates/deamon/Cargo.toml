[package]
name = "deamon"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
tonic = { version = "0.14.2", features = ["server"] }
deamon-protocol = { path = "../deamon-protocol/" }

anyhow = "1.0.100"
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio-tungstenite = "0.28.0"
webrtc = "0.14.0"

audio_capture = { path = "../audio_capture/" }
audio_playback = { path = "../audio_playback/" }
clap = { version = "4.5.51", features = ["derive"] }
