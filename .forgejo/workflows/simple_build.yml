on: [push]

jobs:
  build-linux:
    runs-on: ubunut-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build client 
        run: cargo build --release --package client

      - name: Build signaling_server
        run: cargo build --release --package signaling_server

      - name: Upload client artifact
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: client-linux
          path: target/release/client
          if-no-files-found: error

      - name: Upload signaling_server artifact
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: signaling_server
          path: target/release/signaling_server
          if-no-files-found: error
