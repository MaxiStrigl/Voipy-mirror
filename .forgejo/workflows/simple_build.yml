on: 
  push:
    branches:
      - main

jobs:
  build-linux:
    runs-on: docker
    container: 
      image: rust:latest
    steps:
      - name: Install Dependencies (Node, libasound2-dev, cmake, protobuf)
        run: |
          apt-get update
          apt-get install -y curl ca-certificates libasound2-dev cmake protobuf-compiler
          curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
          apt-get install -y nodejs

      - name: Checkout Code
        uses: https://github.com/actions/checkout@v3

      - name: Build voipyd (daemon)
        run: cargo build --release --package voipyd 

      - name: Build (voipy) cli-client 
        run: cargo build --release --package  voipy

      - name: Build voipy-signaling-server
        run: cargo build --release --package voipy-signaling-server

      - name: Upload deamon artifact
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: voipyd
          path: target/release/voipyd
          if-no-files-found: error

      - name: Upload cli-client artifact
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: voipy
          path: target/release/voipy
          if-no-files-found: error

      - name: Upload voipy-signaling-server artifact
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: voipy-signaling-server
          path: target/release/voipy-signaling-server
          if-no-files-found: error
