container: 
  image: ghcr.io/catthehacker/ubuntu:act-22.04

steps:
  - name: Checkout Code
    uses: https://github.com/actions/checkout@v4

  - name: Print Hello
    run: echo "Hello, Forgejo! This is a simple print test."

  - name: Print System Info
    run: |
      echo "Here is systems information from the runner container:"
      echo "------------------------------------------------------"
      echo "Who am I: $(whoami)"
      echo "Current directory: $(pwd)"
      echo "Linux Version:"
      uname -a
