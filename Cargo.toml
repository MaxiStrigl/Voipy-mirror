[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
members = [
  "crates/protocol",
  "crates/audio_capture",
  "crates/audio_playback",
  "crates/signaling_server",
  "crates/daemon",
  "crates/cli-client",
  "crates/daemon-protocol"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.100"
audio_capture = { path = "./crates/audio_capture/" }
audio_playback = { path = "./crates/audio_playback/" }
clap = { version = "4.5.4", features = ["derive"] }
cpal = "0.17.0"
daemon-protocol = { path = "./crates/daemon-protocol/" }
futures-util = "0.3.31"
opus = "0.3.0"
prost = "0.14.1"
rubato = "0.16.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = "0.28.0"
tonic = "0.14.2"
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"
ringbuf = "0.4.8"
warp = { version = "0.4.2", features = ["server", "websocket"] }
webrtc = "0.17.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-leve = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
