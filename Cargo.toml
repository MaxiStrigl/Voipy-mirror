[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
members = [
  "crates/audio_capture",
  "crates/audio_playback",
  "crates/cli-client",
  "crates/daemon",
  "crates/daemon-protocol",
  "crates/signaling_server"]
resolver = "3"

[workspace.dependencies]

anyhow = "1.0.100"
audio_capture = { path = "./crates/audio_capture/" }
audio_playback = { path = "./crates/audio_playback/" }
audio_thread_priority = "0.34.0"
clap = { version = "4.5.4", features = ["derive"] }
clearscreen = "4.0.6"
core_affinity = "0.8.3"
cpal = "0.17.0"
daemon-protocol = { path = "./crates/daemon-protocol/" }
directories = "6.0.0"
fundsp = "0.20.0"
futures-util = "0.3.31"
nnnoiseless = "0.5.2"
opus = "0.3.0"
prost = "0.14.1"
ringbuf = "0.4.8"
rubato = "0.16.2"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio-tungstenite = "0.28.0"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.10"
tonic = "0.14.2"
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"
warp = { version = "0.4.2", features = ["server", "websocket"] }
webrtc = "0.17.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
